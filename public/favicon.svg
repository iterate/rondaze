  <!-- craters -->
  <circle cx="25" cy="26" r="3.2" fill="#848c8e" opacity="0.45"/>
  <circle cx="38" cy="37" r="4.2" fill="#848c8e" opacity="0.45"/>
  <circle cx="27" cy="40" r="2.4" fill="#848c8e" opacity="0.45"/>

